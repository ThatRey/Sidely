name: Feature Request
description: Suggest a feature
title: "[FEATURE REQUEST] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request! Before you continue, please **search the existing issues for this repository** in case it has already been suggested.

        Sidely is an independent fork. Please do not send Sidely feature requests to SideStore, AltStore, or Apple.
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What is the feature? How would it work?
      placeholder: Please be clear and concise with your description.
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use cases
      description: Please include multiple use cases where this feature would be useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: If you have alternative ideas of how this feature could work, you can put them here.
